<style>

    --surface: #161921;

  /* WHY SECTION */

  /* RESULTS GRID */

  /* LAPTOP CARD */

  .lcard:hover { border-color: var(--border2); transform: translateY(-2px); }

  .lcard-brand-logo { font-family: var(--font-head); font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.25); letter-spacing: 2px; }

  .lcard-brand { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.5px; margin-bottom: 4px; }

  .lcard-specs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }

  .lcard-link { display: block; text-align: center; padding: 8px; margin: 0 14px 14px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; font-size: 12px; color: var(--muted); text-decoration: none; transition: all 0.15s; }
  .lcard-link:hover { border-color: var(--accent); color: var(--accent); }

  /* RANK BADGE */
  .rank-1 .lcard-img { background: linear-gradient(135deg, rgba(108,110,255,0.15), rgba(167,139,250,0.1)); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* UPLOAD ZONE */
  .upload-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 40px; text-align: center; }
  .upload-box { border: 2px dashed var(--border2); border-radius: 20px; padding: 50px 40px; cursor: pointer; transition: border-color 0.2s; max-width: 480px; width: 100%; }
  .upload-box:hover { border-color: var(--accent); }

  /* LOADING */

  @keyframes spin { to { transform: rotate(360deg); } }

  /* PAGINATION */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px; }
  .page-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: var(--font-body); }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

<body>
<div id="root"></div>

<script>
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ─── CPU MAPPING ─── */
function scoreCPU(cpuStr) {
  if (!cpuStr) return 1;
  const s = cpuStr.toLowerCase();
  if (s.includes('m2 max') || s.includes('m2 ultra')) return 5;
  if (s.includes('m2 pro')) return 4.5;
  if (s.includes('m2')) return 4;
  if (s.includes('m1 max') || s.includes('m1 ultra')) return 4.5;
  if (s.includes('m1 pro')) return 4;
  if (s.includes('m1')) return 3.5;
  if (s.includes('i9')) return 4;
  if (s.includes('i7')) return 3;
  if (s.includes('i5')) return 2;
  if (s.includes('i3')) return 1;
  if (s.includes('ryzen 9')) return 4;
  if (s.includes('ryzen 7')) return 3;
  if (s.includes('ryzen 5')) return 2;
  if (s.includes('ryzen 3')) return 1;
  if (s.includes('celeron') || s.includes('pentium')) return 0.5;
  return 1.5;
}

/* ─── DATA NORMALIZERS ─── */
function parseRAM(ram) {
  if (!ram) return 8;
  const m = ram.match(/(\d+)\s*GB/i);
  return m ? parseInt(m[1]) : 8;
}

function parseStorage(s) {
  if (!s) return 256;
  if (s.toLowerCase().includes('4 tb')) return 4000;
  if (s.toLowerCase().includes('2 tb')) return 2000;
  if (s.toLowerCase().includes('1 tb')) return 1000;
  const m = s.match(/(\d+)\s*GB/i);
  return m ? parseInt(m[1]) : 256;
}

function parseScreen(s) {
  if (!s) return 15.6;
  // Try to extract inch value
  const inch = s.match(/(\d+\.?\d*)\s*inch/i) || s.match(/(\d+\.?\d*)\s*Inch/i);
  if (inch) return parseFloat(inch[1]);
  // Convert cm: "39.62 cm"
  const cm = s.match(/([\d.]+)\s*cm/i);
  if (cm) return Math.round((parseFloat(cm[1]) / 2.54) * 10) / 10;
  return 15.6;
}

function parseOS(osStr) {
  if (!osStr) return 'windows';
  const s = osStr.toLowerCase();
  if (s.includes('mac') || s.includes('macos')) return 'macos';
  if (s.includes('freedos') || s.includes('linux') || s.includes('dos')) return 'freedos';
  return 'windows';
}

function extractBrand(model) {
  if (!model) return 'Other';
  const first = model.split(' ')[0].trim();
  const knownBrands = { ASUS: 'ASUS', HP: 'HP', DELL: 'Dell', Lenovo: 'Lenovo', MSI: 'MSI', Acer: 'Acer', APPLE: 'Apple', SAMSUNG: 'Samsung', ALIENWARE: 'Alienware', GIGABYTE: 'Gigabyte', MICROSOFT: 'Microsoft', LG: 'LG', Infinix: 'Infinix', Avita: 'Avita' };
  return knownBrands[first] || first;
}

/* ─── NORMALIZE DATASET ─── */
function normalizeDataset(raw) {
  return raw
    .filter(r => r['Fiyat_TL'] && r['Model'])
    .map((r, i) => {
      const price = parseInt(r['Fiyat_TL']) || 0;
      const ram = parseRAM(r['RAM']);
      const storage = parseStorage(r['Depolama']);
      const screen = parseScreen(r['Ekran_Boyutu']);
      const cpuScore = scoreCPU(r['Islemci']);
      const osType = parseOS(r['Isletim_Sistemi']);
      const brand = extractBrand(r['Model']);
      return { id: i, model: r['Model'], brand, price, ram, storage, screen, cpuScore, osType, cpu: r['Islemci'], os: r['Isletim_Sistemi'], storage_raw: r['Depolama'], ram_raw: r['RAM'] };
    })
    .filter(r => r.price > 0);
}

/* ─── STEP 1: applyFilters — HARD CONSTRAINTS ONLY, runs before AHP ─── */
function applyFilters(laptops, filters) {
  return laptops.filter(l => {
    // Price: hard range filter
    if (l.price < filters.priceRange[0] || l.price > filters.priceRange[1]) return false;

    // Search: model or brand substring match
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!l.model.toLowerCase().includes(q) && !l.brand.toLowerCase().includes(q)) return false;
    }

    // RAM: exact GB match from checked set
    if (filters.ram.length > 0 && !filters.ram.includes(l.ram)) return false;

    // Storage: exact GB match (512, 1000, 2000, 4000)
    if (filters.storage.length > 0 && !filters.storage.includes(l.storage)) return false;

    // Screen size: rounded to 1 decimal, match within ±0.5" bucket
    if (filters.screen.length > 0) {
      const match = filters.screen.some(s => Math.abs(l.screen - s) <= 0.5);
      if (!match) return false;
    }

    // CPU tier: keyword match against cpuTier string (e.g. "i7", "ryzen 5", "m2")
    if (filters.cpu.length > 0) {
      const cpuLow = l.cpu.toLowerCase();
      const match = filters.cpu.some(c => cpuLow.includes(c.toLowerCase()));
      if (!match) return false;
    }

    // OS: match canonical osType string
    if (filters.os.length > 0 && !filters.os.includes(l.osType)) return false;

    // Brand
    if (filters.brand.length > 0 && !filters.brand.includes(l.brand)) return false;

    return true;
  });
}

/* ─── STEP 2: applyAHP — RANKING ONLY, runs on already-filtered data ─── */
function applyAHP(laptops, weights) {
  if (!laptops.length) return [];

  // Compute min/max from the FILTERED set so normalization is relative to visible data
  const maxPrice = Math.max(...laptops.map(l => l.price));
  const minPrice = Math.min(...laptops.map(l => l.price));
  const maxRAM    = Math.max(...laptops.map(l => l.ram));
  const maxStorage= Math.max(...laptops.map(l => l.storage));
  const maxScreen = Math.max(...laptops.map(l => l.screen));
  const maxCPU    = Math.max(...laptops.map(l => l.cpuScore));

  const priceRange = maxPrice - minPrice || 1;

  // Normalize user weights → sum to 1
  const total = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  const Wn = {
    price:   weights.price   / total,
    ram:     weights.ram     / total,
    cpu:     weights.cpu     / total,
    storage: weights.storage / total,
    screen:  weights.screen  / total,
    os:      weights.os      / total,
  };

  return laptops.map(l => {
    // Cost criterion: lower price → higher normalized score
    const pPrice   = (maxPrice - l.price) / priceRange;
    // Benefit criteria: higher value → higher score
    const pRAM     = maxRAM     > 0 ? l.ram       / maxRAM     : 0;
    const pStorage = maxStorage > 0 ? l.storage    / maxStorage : 0;
    const pScreen  = maxScreen  > 0 ? l.screen     / maxScreen  : 0;
    const pCPU     = maxCPU     > 0 ? l.cpuScore   / maxCPU     : 0;
    // OS: neutral 1.0 (filtering already removed unwanted OS — AHP doesn't re-penalize)
    const pOS = 1.0;

    const score =
      Wn.price   * pPrice   +
      Wn.ram     * pRAM     +
      Wn.cpu     * pCPU     +
      Wn.storage * pStorage +
      Wn.screen  * pScreen  +
      Wn.os      * pOS;

    return {
      ...l,
      score:     Math.round(score * 1000) / 1000,
      normPrice: Math.round(pPrice   * 100) / 100,
      normRAM:   Math.round(pRAM     * 100) / 100,
      normCPU:   Math.round(pCPU     * 100) / 100,
    };
  }).sort((a, b) => b.score - a.score);
}

/* ─── BRAND COLORS ─── */
const BRAND_COLORS = {
  Apple: '#636366', ASUS: '#00aaff', MSI: '#d00', HP: '#0096d6',
  Dell: '#007db8', Lenovo: '#e2231a', Acer: '#83b81a', Samsung: '#1428a0',
  Alienware: '#0ff', Gigabyte: '#eb6e0a', Microsoft: '#00a4ef', LG: '#a50034',
};
function brandColor(brand) { return BRAND_COLORS[brand] || '#8a90a0'; }

const BRAND_LINKS = {
  Apple: 'https://www.apple.com', ASUS: 'https://www.asus.com', MSI: 'https://www.msi.com',
  HP: 'https://www.hp.com', Dell: 'https://www.dell.com', Lenovo: 'https://www.lenovo.com',
  Acer: 'https://www.acer.com', Samsung: 'https://www.samsung.com/tr',
  Alienware: 'https://www.alienware.com', Gigabyte: 'https://www.gigabyte.com',
  Microsoft: 'https://www.microsoft.com', LG: 'https://www.lg.com',
};

/* ─── BRAND LOGO ─── */
function BrandLogo({ brand, size = 'md' }) {
  const color = brandColor(brand);
  const fs = size === 'lg' ? 20 : 15;
  return React.createElement('div', {
    style: { fontFamily: "'Syne', sans-serif", fontSize: fs, fontWeight: 800, color: color, letterSpacing: 1, opacity: 0.9 }
  }, brand.toUpperCase());
}

/* ─── FORMAT HELPERS ─── */
function fmtPrice(p) { return '₺' + p.toLocaleString('tr-TR'); }
function fmtStorage(s) { return s >= 1000 ? (s / 1000) + ' TB' : s + ' GB'; }

/* ─── GENERATE WHY TEXT ─── */
function generateWhy(laptop, Wn) {
  const sorted = Object.entries(Wn).sort((a, b) => b[1] - a[1]);
  const labelMap = { price: 'fiyat', ram: 'RAM', cpu: 'işlemci', storage: 'depolama', screen: 'ekran boyutu', os: 'işletim sistemi' };
  const top2 = sorted.slice(0, 2).map(([k]) => labelMap[k]);
  const priceStr = laptop.price < 50000 ? 'uygun fiyatlı' : laptop.price > 150000 ? 'üst segmentte' : 'orta fiyat aralığında';
  return `Bu laptop, ${top2.join(' ve ')} kriterlerine verdiğiniz yüksek önem nedeniyle önerildi. ${fmtPrice(laptop.price)} ile ${priceStr} konumlanıyor. AHP skoru ${(laptop.score * 100).toFixed(1)} üzerinden değerlendirilmiştir.`;
}

/* ─── AHP SLIDERS ─── */
function AHPSliders({ weights, onChange }) {
  const criteria = [
    { key: 'price', label: 'Fiyat Önemi', icon: '₺' },
    { key: 'ram', label: 'RAM Önemi', icon: 'R' },
    { key: 'cpu', label: 'İşlemci Önemi', icon: 'C' },
    { key: 'storage', label: 'Depolama Önemi', icon: 'D' },
    { key: 'screen', label: 'Ekran Önemi', icon: 'E' },
    { key: 'os', label: 'OS Önemi', icon: 'O' },

  const total = Object.values(weights).reduce((a, b) => a + b, 0) || 1;

  return React.createElement('div', { className: 'ahp-panel' },
    React.createElement('div', { className: 'ahp-title' },
      React.createElement('span', { style: { fontSize: 14 } }, '⚡'),
      'AHP Ağırlıkları'

    criteria.map(c =>

      )

  );
}

      React.createElement('div', { style: { fontFamily: "'Syne',sans-serif", fontSize: 18, fontWeight: 800, letterSpacing: -0.5 } },

        React.createElement('div', { className: 'search-wrap' },
          React.createElement('span', { className: 'search-icon' }, '🔍'),
          React.createElement('input', {
            type: 'text', placeholder: 'Model veya Marka...', className: 'search-input',
            value: filters.search,
            onChange: e => onFilters({ search: e.target.value })
          })
        )
      ),

      // Price range slider
      React.createElement('div', { className: 'sidebar-section', style: { marginTop: 14 } },
        React.createElement('div', { className: 'sidebar-label' }, 'Max Fiyat'),
        React.createElement('div', { className: 'price-range' },
          React.createElement('input', {

      ),

      React.createElement('div', { className: 'sidebar-section', style: { marginTop: 14 } },

            React.createElement('button', {
              key: s,
              className: 'chip' + (filters.screen.includes(s) ? ' active' : ''),
              onClick: () => onFilters({ screen: toggle(filters.screen, s) })
            }, s + '"')
          )
        )

      // CPU tier — keyword-based, multi-select

/* ─── UPLOAD SCREEN ─── */
function UploadScreen({ onLoad }) {
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  function handleFile(file) {
    if (!file) return;
    setLoading(true);
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      encoding: 'UTF-8',
      complete: (result) => {
        const data = normalizeDataset(result.data);
        setLoading(false);
        onLoad(data);
      },
      error: () => setLoading(false)
    });
  }

  function handleDrop(e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }

  return React.createElement('div', { className: 'upload-zone' },
    React.createElement('div', { className: 'upload-box', onDrop: handleDrop, onDragOver: e => e.preventDefault(), onClick: () => fileRef.current.click() },
      loading
        ? React.createElement('div', null,
            React.createElement('div', { className: 'spinner' }),
            React.createElement('div', { style: { fontSize: 14, color: 'var(--muted)' } }, 'Veriler işleniyor...')
          )
        : React.createElement('div', null,
            React.createElement('div', { className: 'upload-icon' }, '💻'),
            React.createElement('div', { className: 'upload-title' }, 'CSV Dosyasını Yükle'),
            React.createElement('div', { className: 'upload-sub' }, 'laptop_data_temiz.csv dosyanı buraya sürükle veya tıklayarak seç. Sistem AHP algoritmasıyla en uygun laptopu hesaplar.'),
            React.createElement('div', { className: 'upload-hint' }, 'Model, Fiyat_TL, RAM, Islemci, Isletim_Sistemi, Depolama, Ekran_Boyutu')
          ),
      React.createElement('input', { type: 'file', accept: '.csv', ref: fileRef, onChange: e => handleFile(e.target.files[0]) })
    )
  );
}

/* ─── MAIN APP ─── */
function App() {
  const [laptops, setLaptops] = useState(null); // normalized dataset (raw parsed)
  const [weights, setWeights] = useState({ price: 3, ram: 3, cpu: 3, storage: 2, screen: 2, os: 1 });

  // Correct filter state — all arrays for multi-select, priceRange as [min, max]
  const [filters, setFilters] = useState({
    search:     '',
    priceRange: [0, 252000],
    ram:        [],   // number[] e.g. [16, 32]
    storage:    [],   // number[] canonical GB e.g. [512, 1000]
    screen:     [],   // number[] e.g. [15.6]
    cpu:        [],   // string[] keyword e.g. ['core i7', 'ryzen 9']
    os:         [],   // string[] osType e.g. ['windows', 'macos']
    brand:      [],   // string[] e.g. ['ASUS', 'HP']
  });
  const [page, setPage] = useState(1);
  const PER_PAGE = 12;

  // Merge-patch filters and reset to page 1
  function patchFilters(patch) {
    setFilters(f => ({ ...f, ...patch }));
    setPage(1);
  }

  // Brand list from raw data, sorted by frequency
  const brands = useMemo(() => {
    if (!laptops) return [];
    const cnt = {};
    laptops.forEach(l => cnt[l.brand] = (cnt[l.brand] || 0) + 1);
    return Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([b]) => b);
  }, [laptops]);

  /*
   * CORRECT PIPELINE:
   *   normalizeDataset (on load) → applyFilters → applyAHP → sorted results
   *
   * applyFilters runs FIRST as hard constraints (eleme).
   * applyAHP runs SECOND on the already-filtered subset (sıralama).
   * AHP never overrides or circumvents the filter.
   */
  const results = useMemo(() => {
    if (!laptops) return [];
    const afterFilter = applyFilters(laptops, filters);   // Step 1: hard constraints
    const afterAHP    = applyAHP(afterFilter, weights);   // Step 2: ranking only
    return afterAHP;                                      // already sorted desc by score
  }, [laptops, filters, weights]);

  const topPick  = results[0];
  const rest     = results.slice(1);
  const pageCount= Math.ceil(rest.length / PER_PAGE);
  const paged    = rest.slice((page - 1) * PER_PAGE, page * PER_PAGE);

  if (!laptops) {
    return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', height: '100vh' } },
      React.createElement('div', { style: { padding: '18px 28px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 12 } },
        React.createElement('div', { style: { fontFamily: "'Syne',sans-serif", fontSize: 20, fontWeight: 800, letterSpacing: -0.5 } },
          'Lap', React.createElement('span', { style: { color: 'var(--accent)' } }, 'top'), React.createElement('span', { style: { color: 'var(--accent2)' } }, 'AI')
        ),
        React.createElement('span', { style: { fontSize: 12, color: 'var(--muted)' } }, '— AHP Tabanlı Laptop Öneri Sistemi')
      ),
      React.createElement(UploadScreen, { onLoad: setLaptops })
    );
  }

  return React.createElement('div', { className: 'app' },
    React.createElement(Sidebar, { filters, onFilters: patchFilters, weights, onWeights: setWeights, brands }),
    React.createElement('div', { className: 'main' },
      React.createElement('div', { className: 'topbar' },
        React.createElement('div', null,
          React.createElement('div', { style: { fontFamily: "'Syne',sans-serif", fontSize: 16, fontWeight: 700 } }, 'Katalog'),
          React.createElement('div', { style: { fontSize: 12, color: 'var(--muted)' } }, 'AHP algoritması ile kişisel tercihlerinize göre sıralandı')
        ),
        React.createElement('div', { style: { display: 'flex', gap: 10, alignItems: 'center' } },
          React.createElement('span', { className: 'badge-count' }, results.length.toLocaleString('tr-TR') + ' sonuç'),
          React.createElement('button', { className: 'btn-secondary', style: { fontSize: 12, padding: '6px 14px' }, onClick: () => setLaptops(null) }, '↑ Yeni CSV')
        )
      ),
      React.createElement('div', { className: 'content' },
        topPick
          ? React.createElement(RecommendationHero, { laptop: topPick, weights })
          : React.createElement('div', { className: 'empty' },
              React.createElement('div', { className: 'empty-icon' }, '🔍'),
              React.createElement('div', { className: 'empty-text' }, 'Kriterlere uygun laptop bulunamadı. Filtreleri gevşetin.')
            ),
        paged.length > 0 && React.createElement('div', null,
          React.createElement('div', { className: 'results-header' },
            React.createElement('div', { className: 'results-title' }, 'Tüm Sonuçlar'),
            React.createElement('div', { className: 'results-count' },
              (page - 1) * PER_PAGE + 1 + '–' + Math.min(page * PER_PAGE, rest.length) + ' / ' + rest.length
            )
          ),
          React.createElement('div', { className: 'grid' },
            paged.map((l, i) => React.createElement(LaptopCard, { key: l.id, laptop: l, rank: i + 2 + (page - 1) * PER_PAGE }))
          ),
          pageCount > 1 && React.createElement('div', { className: 'pagination' },
            React.createElement('button', { className: 'page-btn', disabled: page === 1, onClick: () => setPage(p => p - 1) }, '← Önceki'),
            ...[...Array(Math.min(pageCount, 7))].map((_, i) => {
              const p = i + 1;
              return React.createElement('button', { key: p, className: 'page-btn' + (page === p ? ' active' : ''), onClick: () => setPage(p) }, p);
            }),
            React.createElement('button', { className: 'page-btn', disabled: page === pageCount, onClick: () => setPage(p => p + 1) }, 'Sonraki →')
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
